[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evanthea"
version = "0.1.0"
description = "Evolutionary Variant Analysis for Theoretical Protein Adaptation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Dev Mehta"}
]
keywords = [
    "computational-biology",
    "protein-engineering",
    "protein-language-models",
    "evolutionary-computation",
    "reinforcement-learning"
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "biopython>=1.83",
    "pydantic>=2.7.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "h5py>=3.11.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "cachetools>=5.3.3",
    "requests>=2.31.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
